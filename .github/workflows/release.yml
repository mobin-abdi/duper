name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: duper-linux-x86_64.tar.gz
            binary: duper

          # Linux ARM64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: duper-linux-arm64.tar.gz
            binary: duper

          # Windows x86_64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: duper-windows-x86_64.zip
            binary: duper.exe

          # Windows ARM64
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: duper-windows-arm64.zip
            binary: duper.exe

          # macOS x86_64
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: duper-macos-x86_64.tar.gz
            binary: duper

          # macOS ARM64
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: duper-macos-arm64.tar.gz
            binary: duper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir package
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} package/
          tar -czf ${{ matrix.archive }} -C package ${{ matrix.binary }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" "package\${{ matrix.binary }}"
          Compress-Archive `
            -Path "package\${{ matrix.binary }}" `
            -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
